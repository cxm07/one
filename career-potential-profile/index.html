<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大学生职业潜能画像</title>
  <style>
    :root{--ink:#172029;--muted:#66717d;--line:#d9e0e7;--paper:#fbfcfd;--teal:#26736d;--amber:#b85c38}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:24px 0 60px}.topbar{display:flex;align-items:center;gap:14px;margin-bottom:26px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:8px;background:var(--teal);color:white;font-weight:800}.topbar span,.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:34px;align-items:center;min-height:calc(100vh - 130px)}h1{font-size:clamp(38px,6vw,68px);line-height:1.05;margin:10px 0 18px}h2{font-size:26px;margin:0 0 14px}.lead{font-size:18px;line-height:1.8;color:var(--muted)}.eyebrow{margin:0;color:var(--teal);font-weight:800;font-size:13px}.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.primary,.ghost,.icon{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:8px;border:1px solid transparent;padding:0 17px;font-weight:800}.primary{background:var(--teal);color:white}.ghost,.icon{background:white;border-color:var(--line);color:var(--ink)}.icon{width:44px;padding:0}.panel,.card,.notice{background:white;border:1px solid var(--line);border-radius:8px}.panel{padding:18px;box-shadow:0 18px 50px rgba(23,32,41,.09)}canvas{width:100%;height:auto}.notice{display:flex;gap:16px;align-items:center;padding:18px 20px;margin:20px 0 36px;background:#eef7f5}.notice p{margin:0;color:#3d5552;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{padding:18px;border-top:4px solid var(--accent)}.card p{color:var(--muted);line-height:1.7}.assessment{max-width:960px}.progress{height:12px;background:#e8edf2;border-radius:999px;overflow:hidden;margin:18px 0 24px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber))}.group{padding:20px;margin-bottom:16px}.group header{display:flex;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:8px}.badge{display:grid;place-items:center;width:42px;height:42px;border-radius:8px;background:#e7f3f1;color:var(--teal);font-weight:800;flex:0 0 auto}.question{border:0;border-bottom:1px solid #edf1f4;padding:18px 0;margin:0}.question legend{font-weight:800;line-height:1.6;margin-bottom:12px}.question.missing{background:#fff4ef;border-radius:8px;padding-left:12px;padding-right:12px}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.scale input{position:absolute;opacity:0}.scale span{display:grid;place-items:center;min-height:52px;border:1px solid var(--line);border-radius:8px;background:#f8fafb;text-align:center;color:#43505c;font-size:14px;padding:8px}.scale input:checked+span{border-color:var(--teal);background:#e7f3f1;color:#1d5f59;font-weight:800}.sticky{position:sticky;bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);box-shadow:0 18px 50px rgba(23,32,41,.12)}.report-hero{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:28px;align-items:center}.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.score-card h3{margin:0}.score-head{display:flex;justify-content:space-between;align-items:baseline}.score{font-size:34px;font-weight:900;color:var(--accent)}.track{height:9px;border-radius:999px;background:#edf1f4;overflow:hidden}.track span{display:block;height:100%;background:var(--accent)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.insight{padding:12px 0;border-top:1px solid #edf1f4}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.actions article{min-height:140px}.num{color:var(--teal);font-weight:900}.toolbar{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none}@media(max-width:860px){.hero,.report-hero,.columns{grid-template-columns:1fr}.grid,.score-grid,.actions{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid,.score-grid,.actions,.scale{grid-template-columns:1fr}.notice,.sticky,.topbar{align-items:stretch;flex-direction:column}.toolbar{margin-left:0}.primary,.ghost{width:100%}h1{font-size:36px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const dims={interest:{label:"职业兴趣",short:"兴趣",color:"#26736d",desc:"你对职业活动、行业探索和真实工作任务的主动靠近程度。",high:"你更容易从真实任务中找到投入感，适合多做行业访谈、项目实践和岗位观察。",low:"你可以从低成本探索开始：每周了解一个行业、一次岗位访谈、一次小项目。",actions:["选 3 个感兴趣岗位，记录它们每天真正做什么。","做一次校友或学长学姐访谈，重点问工作内容和成长路径。"]},learning:{label:"学习敏捷",short:"学习",color:"#4f6fb5",desc:"你面对新知识、新工具、新环境时的吸收、迁移和复盘能力。",high:"你适合进入变化较快、需要持续学习的方向，但要把学习结果转化成作品或经历。",low:"你可以先建立更稳定的学习节奏，把大目标拆成可完成的小任务。",actions:["选择一个求职相关技能，连续 14 天每天练习 30 分钟。","每周写一次复盘：学到了什么、卡在哪里、下次怎么改。"]},problem:{label:"问题解决",short:"解题",color:"#b85c38",desc:"你分析问题、拆解信息、提出方案和验证结果的倾向。",high:"你有较好的结构化思考基础，适合训练案例分析、产品拆解、数据分析或技术项目。",low:"你可以从固定框架开始练习，比如先写清问题、约束、备选方案和验证方式。",actions:["每周拆解一个真实问题，写出原因、证据、方案和风险。","练习用数据或事实支持观点，减少只凭感觉判断。"]},execution:{label:"执行自律",short:"执行",color:"#8f6a2e",desc:"你把计划持续推进、管理时间和完成承诺的稳定程度。",high:"你具备把想法落地的基础，可以把优势用在作品集、证书、竞赛或实习准备上。",low:"你需要优先减少目标过多和计划过大，用可追踪的小周期建立信心。",actions:["设定一个 30 天目标，只保留 3 个关键动作。","每天固定一个低干扰时段完成最重要任务。"]},communication:{label:"沟通协作",short:"协作",color:"#7d5aa6",desc:"你表达观点、倾听反馈、推进合作和处理分歧的能力准备度。",high:"你适合多参与团队项目、社团协作和跨专业任务，并把协作成果写进经历。",low:"你可以先训练清晰表达和主动反馈，减少误解和被动等待。",actions:["在一次小组任务中主动承担对齐需求和同步进度的角色。","练习用“结论、理由、下一步”三句话表达观点。"]},resilience:{label:"抗压适应",short:"适应",color:"#3f7b45",desc:"你面对压力、失败、变化和不确定性时的调节与恢复能力。",high:"你在压力下仍能保持行动力，可以挑战更真实的实习、竞赛或复杂项目。",low:"你需要先建立可恢复的节奏，避免长期高压下硬扛。",actions:["记录一周压力来源，区分可控制和不可控制事项。","把失败经历整理成“发生了什么、学到什么、下次怎么做”。"]},values:{label:"职业价值观",short:"价值",color:"#c04f65",desc:"你对工作意义、成长、稳定、收入、影响力和生活平衡的清晰程度。",high:"你更容易做出一致的选择，适合把价值排序转化为择业标准。",low:"你可以通过比较具体机会来形成判断，逐步知道自己看重什么。",actions:["写下你最看重的 5 个工作条件，并排序。","比较两个真实岗位，标出它们分别满足和牺牲了什么。"]}};
    const options=["非常不同意","比较不同意","不确定","比较同意","非常同意"];
    const baseTexts={interest:["我会主动了解不同职业每天具体做什么。","看到一个新行业时，我通常愿意进一步查资料。","我更愿意通过实践项目判断自己是否喜欢某个方向。","如果课程作业允许自选主题，我会选择贴近真实职业场景的题目。","我很少思考未来工作会带给我怎样的日常生活。","我愿意和学长学姐或从业者交流职业经验。","我能说出至少几个自己想进一步探索的职业方向。","我通常只在临近求职时才会关注职业信息。"],learning:["面对陌生知识时，我会先找入门资料建立整体框架。","我能根据反馈快速调整学习方法。","我学到新工具后，会尝试把它用到真实任务里。","如果实习要求掌握一项新技能，我会拆成小目标并持续练习。","一遇到难懂内容，我通常会很快放弃。","我会定期复盘自己为什么学得快或慢。","我能把一个领域学到的方法迁移到另一个任务中。","我习惯等待别人告诉我该怎么学。"],problem:["遇到复杂问题时，我会先拆分成几个更小的问题。","我会先确认问题真正的目标，而不是马上开始做。","我习惯用事实或数据支持自己的判断。","如果团队方案效果不好，我会回看假设、证据和执行过程。","问题一复杂，我就很难判断下一步该做什么。","我能提出多个备选方案，而不是只盯着第一个想法。","我会主动验证自己的方案是否真的有效。","我常常只凭直觉下结论，不太检查依据。"],execution:["我能把长期目标拆成每周可执行的任务。","答应别人的事情，我通常会按时完成。","我会为重要任务预留稳定时间。","如果简历、作品集和考试同时推进，我会先排优先级再行动。","我经常制定计划，但很快就中断。","我能在没有外部催促时继续推进任务。","我会定期检查任务进度并调整安排。","临近截止日期前，我才会真正开始行动。"],communication:["我能清楚表达自己的观点和理由。","我会认真听别人反馈，再决定是否调整。","团队合作中，我会主动同步进度和风险。","当小组意见不一致时，我会尝试把分歧具体化并推动下一步。","我常常不知道如何把自己的想法说清楚。","我愿意在公开场合进行简短表达或汇报。","我能根据对象不同调整表达方式。","合作中遇到误解时，我通常会回避沟通。"],resilience:["遇到挫折后，我通常能重新整理状态继续行动。","面对变化时，我能较快适应新的要求。","压力较大时，我会主动寻找调节方法。","如果面试或比赛失败，我会复盘原因并准备下一次。","一旦结果不理想，我很容易否定自己所有努力。","我能区分哪些事情可控制，哪些只能接受。","我能在不确定中先做出一个可行的小行动。","压力一上来，我往往会完全停住。"],values:["我知道自己选择工作时最看重哪些条件。","我能区分自己真正重视的东西和别人期待我的东西。","面对收入、成长、稳定和兴趣的取舍，我愿意认真比较。","如果两个机会各有优缺点，我会用明确标准做选择。","我选择方向时经常只看别人觉得哪个更好。","我能说出希望工作带给自己的生活状态。","我会通过真实经历修正自己的职业期待。","我很少思考职业选择背后的价值取舍。"]};
    const reverseIndex=new Set([4,7]);
    const items=Object.entries(baseTexts).flatMap(([d,arr])=>arr.map((text,i)=>({id:`${d}-${i}`,dimension:d,text,reverse:reverseIndex.has(i)})));
    const state={route:location.hash.replace(/^#/,"")||"/",answers:{},report:null};
    const app=document.querySelector("#app");
    addEventListener("hashchange",()=>{state.route=location.hash.replace(/^#/,"")||"/";render()});
    function go(route){state.route=route;location.hash=route;scrollTo({top:0,behavior:"smooth"});render()}
    function render(){if(state.route==="/assessment")return assessment();if(state.route==="/report")return report();home()}
    function home(){app.innerHTML=`<main class="shell"><nav class="topbar"><div class="mark">CP</div><div><strong>大学生职业潜能画像</strong><br><span>个人发展自测 MVP</span></div></nav><section class="hero"><div><p class="eyebrow">15-20 分钟 · 56 题 · 不保存数据</p><h1>看见当前的职业发展准备度</h1><p class="lead">这不是给你贴标签的测试，而是一份面向大学生的自我探索报告：理解优势、识别优先提升方向，并拿到 30 天行动建议。</p><div class="btns"><button class="primary" data-go="/assessment">开始测评</button><button class="ghost" onclick="document.querySelector('#dims').scrollIntoView({behavior:'smooth'})">查看维度</button></div></div><div class="panel"><canvas id="preview" width="420" height="340"></canvas><p class="muted">输出 7 项个人发展分、优势画像、成长重点和行动计划。</p></div></section><section class="notice"><strong>使用边界</strong><p>本工具仅用于自我探索和职业发展参考，不能替代心理咨询、职业咨询或招聘录用决策。第一版不建立常模，不提供同龄排名。</p></section><section id="dims"><h2>画像维度</h2><div class="grid">${Object.entries(dims).map(([k,d])=>`<article class="card" style="--accent:${d.color}"><h3>${d.label}</h3><p>${d.desc}</p></article>`).join("")}</div></section></main>`;bind();draw("preview",{interest:72,learning:78,problem:66,execution:58,communication:74,resilience:62,values:70})}
    function assessment(){const profile=score();app.innerHTML=`<main class="shell assessment"><nav class="topbar"><button class="icon" data-go="/">←</button><div><strong>职业潜能画像测评</strong><br><span id="count">${items.length-profile.missing.length}/${items.length} 已完成</span></div></nav><p class="eyebrow">请根据最近 3-6 个月的真实状态作答</p><h1>选择最符合你的程度</h1><div class="progress"><span id="bar" style="width:${profile.rate}%"></span></div><form id="form">${Object.keys(dims).map(key=>group(key)).join("")}<div class="sticky panel"><div><strong id="hint">还差 ${profile.missing.length} 题</strong><br><span class="muted">漏答题会在提交时高亮提醒。</span></div><button class="primary">生成报告</button></div></form></main>`;bind();document.querySelector("#form").addEventListener("change",e=>{if(e.target.name)state.answers[e.target.name]=Number(e.target.value);updateProgress()});document.querySelector("#form").addEventListener("submit",e=>{e.preventDefault();const p=score();if(p.missing.length){p.missing.forEach(id=>document.querySelector(`[data-q='${id}']`)?.classList.add("missing"));document.querySelector(`[data-q='${p.missing[0]}']`)?.scrollIntoView({behavior:"smooth",block:"center"});return}state.report=buildReport(p);go("/report")})}
    function group(key){const d=dims[key];return `<section class="group panel"><header><span class="badge">${d.short}</span><div><h2>${d.label}</h2><p class="muted">${d.desc}</p></div></header>${items.filter(i=>i.dimension===key).map((item,idx)=>`<fieldset class="question" data-q="${item.id}"><legend>${idx+1}. ${item.text}</legend><div class="scale">${options.map((o,i)=>`<label><input type="radio" name="${item.id}" value="${i+1}" ${state.answers[item.id]===i+1?"checked":""}><span>${o}</span></label>`).join("")}</div></fieldset>`).join("")}</section>`}
    function report(){if(!state.report){app.innerHTML=`<main class="shell"><button class="ghost" data-go="/assessment">开始测评</button><section class="notice"><strong>报告未生成</strong><p>本工具不保存数据，请先完成测评。</p></section></main>`;bind();return}const r=state.report;app.innerHTML=`<main class="shell"><nav class="topbar"><button class="icon" data-go="/assessment">←</button><div><strong>职业潜能画像报告</strong><br><span>${new Date().toLocaleString("zh-CN")}</span></div><div class="toolbar"><button class="ghost" onclick="copySummary()">复制摘要</button><button class="ghost" onclick="downloadImage()">导出图片</button><button class="ghost" onclick="print()">导出 PDF</button></div></nav><section class="report-hero"><div><p class="eyebrow">个人发展分 · 非排名 · 非招聘结论</p><h1>你的当前职业发展准备画像</h1><p class="lead">这份画像用于帮助你理解当前职业发展准备度。分数代表可发展倾向，不代表固定能力、未来上限或招聘结论。</p>${r.warning?`<div class="notice"><strong>提示</strong><p>${r.warning}</p></div>`:""}</div><div class="panel"><canvas id="radar" width="420" height="340"></canvas></div></section><section class="score-grid">${Object.entries(r.scores).map(([k,s])=>scoreCard(k,s)).join("")}</section><section class="columns"><article class="panel"><h2>Top 3 优势</h2>${r.strengths.map(x=>insight(x,true)).join("")}</article><article class="panel"><h2>优先提升方向</h2>${r.growth.map(x=>insight(x,false)).join("")}</article></section><section><h2>30 天行动计划</h2><div class="actions">${r.actions.map((a,i)=>`<article class="card" style="--accent:#26736d"><span class="num">${String(i+1).padStart(2,"0")}</span><p>${a}</p></article>`).join("")}</div></section><section class="notice"><strong>使用边界</strong><p>本报告仅用于个人自我探索和职业发展参考，不用于心理诊断、能力定级、同龄排名或招聘录用决策。</p></section></main>`;bind();draw("radar",r.scores)}
    function scoreCard(k,s){const d=dims[k];return `<article class="score-card card" style="--accent:${d.color}"><div class="score-head"><h3>${d.label}</h3><span class="score">${s}</span></div><div class="track"><span style="width:${s}%"></span></div><p>${d.desc}</p></article>`}
    function insight(x,high){const d=dims[x.key];return `<div class="insight"><strong>${d.label}</strong> <span>${x.score} 分</span><p class="muted">${high?d.high:d.low}</p></div>`}
    function score(){const totals={};Object.keys(dims).forEach(k=>totals[k]={sum:0,n:0});const vals=[];const missing=[];for(const item of items){const raw=state.answers[item.id];if(!raw){missing.push(item.id);continue}const v=item.reverse?6-raw:raw;totals[item.dimension].sum+=v;totals[item.dimension].n++;vals.push(raw)}const scores={};Object.entries(totals).forEach(([k,t])=>scores[k]=t.n?Math.round(((t.sum/t.n-1)/4)*100):0);const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]).map(([key,score])=>({key,score}));const freq=Math.max(0,...[1,2,3,4,5].map(v=>vals.filter(x=>x===v).length))/(vals.length||1);return{scores,missing,rate:Math.round((items.length-missing.length)/items.length*100),strengths:sorted.slice(0,3),growth:sorted.slice(-2).reverse(),warning:vals.length===items.length&&freq>=.86?"你的作答整体差异较小，本次结果更适合作为初步参考。建议更具体地区分不同情境。":""}}
    function buildReport(p){return{...p,actions:p.growth.flatMap(x=>dims[x.key].actions).slice(0,4)}}
    function updateProgress(){const p=score();document.querySelector("#count").textContent=`${items.length-p.missing.length}/${items.length} 已完成`;document.querySelector("#bar").style.width=p.rate+"%";document.querySelector("#hint").textContent=p.missing.length?`还差 ${p.missing.length} 题`:"可以生成报告"}
    function bind(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go))}
    function draw(id,scores){const c=document.querySelector(`#${id}`);if(!c)return;const ctx=c.getContext("2d"),keys=Object.keys(dims),cx=c.width/2,cy=c.height/2,r=110;ctx.clearRect(0,0,c.width,c.height);ctx.font="14px system-ui";ctx.textAlign="center";for(let l=1;l<=4;l++){ctx.beginPath();keys.forEach((k,i)=>{const p=pt(i,keys.length,r*l/4,cx,cy);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.closePath();ctx.strokeStyle=l===4?"#9aa5b1":"#d8dee6";ctx.stroke()}keys.forEach((k,i)=>{const a=pt(i,keys.length,r,cx,cy),b=pt(i,keys.length,r+30,cx,cy);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(a.x,a.y);ctx.strokeStyle="#d8dee6";ctx.stroke();ctx.fillStyle=dims[k].color;ctx.fillText(dims[k].short,b.x,b.y)});ctx.beginPath();keys.forEach((k,i)=>{const p=pt(i,keys.length,r*(scores[k]||0)/100,cx,cy);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.closePath();ctx.fillStyle="rgba(38,115,109,.18)";ctx.strokeStyle="#26736d";ctx.lineWidth=3;ctx.fill();ctx.stroke()}
    function pt(i,total,r,cx,cy){const a=Math.PI*2*i/total-Math.PI/2;return{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r}}
    window.copySummary=()=>navigator.clipboard.writeText("大学生职业潜能画像报告摘要\n"+state.report.strengths.map(x=>`优势：${dims[x.key].label} ${x.score}分`).join("\n"));
    window.downloadImage=()=>{const c=document.createElement("canvas"),ctx=c.getContext("2d"),r=state.report;c.width=1000;c.height=900;ctx.fillStyle="#fbfcfd";ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle="#172029";ctx.font="700 44px Microsoft YaHei";ctx.fillText("大学生职业潜能画像报告",60,80);ctx.font="24px Microsoft YaHei";let y=140;Object.entries(r.scores).forEach(([k,s])=>{ctx.fillStyle=dims[k].color;ctx.fillText(`${dims[k].label} ${s}分`,60,y);y+=42});ctx.fillStyle="#172029";ctx.font="700 30px Microsoft YaHei";ctx.fillText("30天行动计划",60,y+30);ctx.font="22px Microsoft YaHei";r.actions.forEach((a,i)=>ctx.fillText(`${i+1}. ${a}`,60,y+76+i*42));const a=document.createElement("a");a.download="职业潜能画像.png";a.href=c.toDataURL("image/png");a.click()};
    render();
  </script>
